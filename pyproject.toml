[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
exclude = '(scratch|docs|frontend|simulator)/|validador_conceptual\.py$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]
combine_as_imports = true
include_trailing_comma = true
multi_line_output = 3
force_grid_wrap = 0
use_parentheses = true
extend_skip = ["scratch", "docs", "frontend", "simulator", "validador_conceptual.py"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = "scratch/|docs/|frontend/|simulator/|validador_conceptual\\.py$"
# La capa Flask (app/) es legacy sin tipado estricto: desactivamos códigos de
# errores que generan ruido allí (atributos ad-hoc, Any|None, vars sin anotar).
# El motor puro (maxocontracts/) se mantiene tipado al 100%.
disable_error_code = [
    "import-untyped",
    "attr-defined",
    "arg-type",
    "var-annotated",
    "func-returns-value",
    "return-value",
    "no-any-return",
    "assignment",
]
