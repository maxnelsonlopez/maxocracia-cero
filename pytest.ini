[pytest]
pythonpath = .
env =
    SECRET_KEY=test-secret-key-maxocracia-0123456789abcdef
    FLASK_ENV=testing
; La plataforma educativa es un proyecto independiente con su propio conftest
; y tests de basename colisionante (test_auth, test_meetings...): se corre
; desde plataforma_educativa/ con su propio contexto (sys.path propio).
norecursedirs = plataforma_educativa node_modules .next
